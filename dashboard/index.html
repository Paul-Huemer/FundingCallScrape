  </header>

  <main class="page">
    <div class="layout">
      <!-- All filters live here; on small screens it opens as a sheet -->
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters__head">
          <h2>Filter</h2>
          <button type="button" class="link" data-clear="all" id="clearAll" hidden>Clear all</button>
          <button type="button" class="icon-btn filters__close" id="filtersClose" title="Close">✕<span class="sr-only">Close filters</span></button>
        </div>

        <section class="fgroup">
          <h3>Research area</h3>
          <div id="topicBar" role="group" aria-label="Lab research areas"></div>
        </section>


        <section class="fgroup fgroup--row">
          <label class="field">
            <span>Deadline</span>
            <select id="window">
              <option value="all">Any time</option>
              <option value="30">Next 30 days</option>
              <option value="90">Next 3 months</option>
              <option value="180">Next 6 months</option>
              <option value="365">Next 12 months</option>
            </select>
          </label>
          <label class="field">
            <span>Per project</span>
            <select id="minAmount">
              <option value="0">Any amount</option>
              <option value="50000">≥ €50k</option>
              <option value="250000">≥ €250k</option>
              <option value="1000000">≥ €1M</option>
              <option value="known">Amount stated</option>
            </select>
          </label>
        </section>

        <section class="fgroup checks">
          <label><input type="checkbox" id="directOnly"> Lab can apply directly</label>
          <label><input type="checkbox" id="newOnly"> New this week</label>
          <label><input type="checkbox" id="starredOnly"> Starred</label>
          <label><input type="checkbox" id="showWatch" checked> Monitored funders</label>
        </section>

        <section class="fgroup">
          <h3>Sources</h3>
          <div id="sourceTree"></div>
        </section>
      </aside>

      <section class="content">
        <div class="intro">
          <h1>Funding calls</h1>
          <p class="intro__lede" id="lede">Open research funding matched to the lab's research areas.</p>
        </div>

        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
            <input id="q" type="search" placeholder="Search calls" autocomplete="off" aria-label="Search calls">
            <kbd>/</kbd>
          </label>
          <button type="button" class="btn-outline filters-btn" id="filtersBtn" aria-controls="filters" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 5h18v2H3V5Zm3 6h12v2H6v-2Zm3 6h6v2H9v-2Z"/></svg>
            Filter <span class="badge-n" id="filtBadge" hidden></span>
          </button>
          <label class="sort">
            <span class="sr-only">Sort by</span>
            <select id="sortBy">
              <option value="deadline">Deadline</option>
              <option value="fit">Best fit</option>
              <option value="newest">Newest</option>
              <option value="amount">Amount</option>
              <option value="source">Source</option>
              <option value="title">Title</option>
            </select>
          </label>
          <div class="seg seg--view" role="radiogroup" aria-label="View">
            <button type="button" role="radio" data-view="cards" aria-checked="true" title="Cards">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 4h18v7H3V4Zm0 9h18v7H3v-7Z"/></svg><span class="sr-only">Cards</span>
            </button>
            <button type="button" role="radio" data-view="table" aria-checked="false" title="Table">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 4h18v3H3V4Zm0 5h18v3H3V9Zm0 5h18v3H3v-3Zm0 5h18v2H3v-2Z"/></svg><span class="sr-only">Table</span>
            </button>
          </div>
          <button class="icon-btn" id="exportBtn" type="button" title="Download the filtered list as CSV">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M11 3h2v9.2l3.3-3.3 1.4 1.4-5.7 5.7-5.7-5.7 1.4-1.4 3.3 3.3V3ZM4 18h16v2H4v-2Z"/></svg>
            <span class="sr-only">Export CSV</span>
          </button>
        </div>
        <div class="active" id="activeBar" aria-live="polite"></div>
        <div id="results" class="results" tabindex="-1"></div>
      </section>
    </div>
  </main>

  <footer class="foot">
    <span>Digital Media Lab · FH OÖ Campus Hagenberg</span>

  <!-- Detail drawer -->
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>

      <button class="icon-btn" id="drawerClose" type="button" title="Close (Esc)">✕<span class="sr-only">Close</span></button>
    </div>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>

  <!-- About dialog -->
  <dialog class="profile" id="profileDlg" aria-labelledby="profileTitle">
    <div class="drawer__head">
      <h2 id="profileTitle" class="drawer__title">About the Funding Radar</h2>
      <button class="icon-btn" type="button" data-close>✕<span class="sr-only">Close</span></button>
    </div>
    <div class="drawer__body" id="profileBody"></div>
  </dialog>

  <!-- data.js changes on every update: load it with a timestamp so no browser serves a stale copy -->
  <script>document.write('<script src="data.js?t=' + Date.now() + '"><\/script>');</script>
